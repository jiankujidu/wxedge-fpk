version: "3.8"

services:
  wxedge:
    image: images-cluster.xycloud.com/wxedge/wxedge:latest
    container_name: wxedge-app
    restart: always
    privileged: true
    network_mode: host
    environment:
      - TZ=Asia/Shanghai
      - LISTEN_ADDR=0.0.0.0:5316
    volumes:
      - "/var/apps/wxedge/shares/wxedge/data:/storage"
    tmpfs:
      - /run
      - /tmp
